name: NotchiOS
options:
  bundleIdPrefix: com.zeroorigine
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Notch:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zeroorigine.notch
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Notch
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        NSMicrophoneUsageDescription: Nova listens when you tap the mic.
        NSSpeechRecognitionUsageDescription: Nova turns your voice into text.
        NSCameraUsageDescription: Notch uses the camera light as a torch.
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    dependencies:
      - target: NovaIsland
  NovaIsland:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zeroorigine.notch.island
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Nova Island
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
