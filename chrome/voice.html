<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Nova is listening</title>
<style>
  body { margin: 0; background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 10px; }
  .eq i { display: inline-block; width: 5px; margin: 0 2px; background: #FF8A3D; border-radius: 3px; animation: eq .7s ease-in-out infinite alternate; }
  .eq i:nth-child(2){animation-delay:.15s}.eq i:nth-child(3){animation-delay:.3s}.eq i:nth-child(4){animation-delay:.45s}
  @keyframes eq { from { height: 6px } to { height: 28px } }
  #t { font-size: 17px; min-height: 24px; max-width: 340px; text-align: center; }
  #s { font-size: 12px; color: rgba(255,255,255,.55); }
</style></head>
<body><div class="eq"><i></i><i></i><i></i><i></i></div><div id="t">Listening…</div><div id="s">Speak now. This window closes by itself.</div>
<script src="voice.js"></script></body></html>
